 # This pipeline run three stages Test, Build and Deploy
stages:
  - test
  - build
  - deploy

build_image:
  stage: build
  image: docker:stable
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest

test_application:
  stage: test
  image: $CI_REGISTRY_IMAGE:latest
  services:
    - name: mysql:5.7
      alias: mysql
  script:
    - php vendor/bin/phpunit  # Tes tests PHP
    - sh e2e.sh               # Tes tests End-to-End

deploy_to_render:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache curl
    - curl -X POST $RENDER_DEPLOY_HOOK_URL
  only:
    - master