# Pipeline: Build, Test, Deploy
stages:
  - build
  - test
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

build_image:
  stage: build
  image: docker:stable
  services:
    - docker:dind
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      if docker pull "$CI_REGISTRY_IMAGE:latest" >/dev/null 2>&1; then
        echo "Image $CI_REGISTRY_IMAGE:latest already exists in registry — skipping build."
      else
        docker build -t "$CI_REGISTRY_IMAGE:latest" .
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi

test_application:
  stage: test
  image:
    name: $CI_REGISTRY_IMAGE:latest
    pull_policy: if-not-present
  services:
    - name: mysql:5.7
      alias: mysql
  needs:
    - job: build_image
      optional: true
  script:
    - php vendor/bin/phpunit  # Tests PHP
    - sh e2e.sh               # Tests End-to-End

deploy_to_render:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache curl
    - curl -X POST $RENDER_DEPLOY_HOOK_URL
  only:
    - master